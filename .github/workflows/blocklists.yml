name: Blocklists

# Rebuilds the hosted update feed from upstream sources and publishes it to
# GitHub Pages, which is what `BlocklistUpdater.feedIndexURL` points at.
#
# This job deliberately does NOT touch Shared/Resources/Blocklists. The bundled
# baseline is what a brand-new install has before its first network call, so
# changing it is a release decision, not something a cron job should do behind
# your back. Refresh it by hand before cutting a build:
#
#     python3 scripts/build_feeds.py --update-bundled --base-url <pages-url>

on:
  schedule:
    # Twice a day. The malware and phishing sources publish every 12 hours,
    # so anything more frequent just re-downloads identical data.
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/blocklists.yml"

permissions:
  contents: read

concurrency:
  group: blocklists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the converter
        working-directory: scripts
        run: python3 test_build_feeds.py

      # On a PR we only prove the build still works against live upstreams.
      # Nothing is published from an unmerged branch.
      - name: Validate against live sources
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_feeds.py --check-only

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build feeds
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_feeds.py --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Summarize
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published feeds"
            echo ""
            echo "| Feed | Version | Entries |"
            echo "| --- | --- | --- |"
            python3 - <<'PY'
          import json, pathlib
          index = json.loads(pathlib.Path("dist/feeds.json").read_text())
          for feed in index["feeds"]:
              payload = json.loads(
                  pathlib.Path(f"dist/{feed['identifier']}-v{feed['version']}.json").read_text()
              )
              flag = " (snapshot)" if feed.get("snapshot") else ""
              print(f"| {feed['identifier']}{flag} | v{feed['version']} | {len(payload['entries']):,} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
